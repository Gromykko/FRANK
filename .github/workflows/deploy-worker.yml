name: Release FRANK production

on:
  workflow_dispatch:

# Production is one conservative release mode. Even a UI-only commit passes
# the exact-all Worker gate; there is no checkbox that can accidentally bypass
# data readiness for a commit that also changed shared forecast code.
permissions:
  contents: read

concurrency:
  group: frank-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      build_id: ${{ steps.release.outputs.build_id }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Verify exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release compatibility policy
        run: npm run release:check-contract

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check generated Worker types
        run: npm run worker:types:check

      - name: Type-check Worker and runtime tests
        run: npm run worker:typecheck

      - name: Test Worker runtime
        run: npm run test:worker-runtime

      - name: Validate Worker bundle
        run: npm run worker:dry-run

      - name: Build exact Pages artifact
        run: npm run build

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: End-to-end test exact artifact
        run: npm exec -- playwright test

      - name: Record immutable Pages build
        id: release
        shell: bash
        run: |
          build_id="$(npm run --silent release:build-id)"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "### Release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages build: \`$build_id\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  worker_release:
    needs: build
    runs-on: ubuntu-latest
    # Leave enough time for bounded provider calls and, critically, the
    # restoration steps. A job-level cancellation cannot safely repair traffic.
    timeout-minutes: 30
    environment:
      name: worker-production
      url: https://frank-forecast.alswatchs.workers.dev
    env:
      FRANK_WORKER_BASE_URL: https://frank-forecast.alswatchs.workers.dev
      FRANK_WORKER_SCRIPT: frank-forecast
    outputs:
      candidate_version: ${{ steps.candidate.outputs.version_id }}
      previous_version: ${{ steps.previous.outputs.version_id }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Verify exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install pinned release tooling
        run: npm ci

      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment credentials are not configured for worker-production."
            exit 1
          fi

      - name: Capture exact production version
        id: previous
        shell: bash
        run: |
          version_id="$(npm run --silent worker:active-version)"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attest captured production release
        id: previous_attestation
        run: |
          npm run worker:attest-active-release -- \
            --base-url "$FRANK_WORKER_BASE_URL" \
            --worker-name "$FRANK_WORKER_SCRIPT" \
            --expected-worker-version-id '${{ steps.previous.outputs.version_id }}' \
            --github-output "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload candidate Worker version without traffic
        id: upload
        shell: bash
        run: |
          version_tag="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npm run worker:upload-version -- \
            --tag "$version_tag" \
            --message "Candidate for $GITHUB_SHA" \
            --strict
          echo "tag=$version_tag" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve immutable candidate version
        id: candidate
        shell: bash
        run: |
          version_id="$(npm run --silent worker:version-by-tag -- '${{ steps.upload.outputs.tag }}')"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Include candidate at zero traffic
        id: stage
        shell: bash
        run: |
          npm run worker:deploy-versions -- \
            '${{ steps.previous.outputs.version_id }}@100%' \
            '${{ steps.candidate.outputs.version_id }}@0%' \
            --yes \
            --message "Stage $GITHUB_SHA at zero traffic"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify zero-traffic deployment
        run: npm run --silent worker:verify-deployment -- '${{ steps.previous.outputs.version_id }}@100' '${{ steps.candidate.outputs.version_id }}@0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build shadow caches and verify exact candidate
        id: candidate_gate
        run: |
          npm run worker:warm -- \
            --base-url "$FRANK_WORKER_BASE_URL" \
            --worker-name "$FRANK_WORKER_SCRIPT" \
            --expected-worker-version-id '${{ steps.candidate.outputs.version_id }}' \
            --require-target-ready-all \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --summary-title "Candidate shadow readiness" \
            --attempts 6 \
            --retry-delay-ms 5000

      - name: Promote exact-ready candidate to all traffic
        id: promote
        shell: bash
        run: |
          npm run worker:deploy-versions -- \
            '${{ steps.candidate.outputs.version_id }}@100%' \
            --yes \
            --message "Promote exact-ready release $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify promoted deployment
        run: npm run --silent worker:verify-deployment -- '${{ steps.candidate.outputs.version_id }}@100'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify exact-ready ordinary traffic
        id: ordinary_gate
        run: |
          npm run worker:warm -- \
            --base-url "$FRANK_WORKER_BASE_URL" \
            --expected-worker-version-id '${{ steps.candidate.outputs.version_id }}' \
            --require-target-ready-all \
            --read-only \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --summary-title "Post-promotion read-only readiness" \
            --attempts 5 \
            --retry-delay-ms 3000

      - name: Restore captured production version after failure
        id: restore
        # Staging can mutate the control plane and still exit non-zero. Once a
        # candidate upload succeeded, normalize every later failure back to the
        # exact captured deployment instead of relying on a step outcome guess.
        if: ${{ failure() && steps.previous.outputs.version_id != '' && steps.upload.outcome == 'success' }}
        shell: bash
        run: |
          npm run worker:deploy-versions -- \
            '${{ steps.previous.outputs.version_id }}@100%' \
            --yes \
            --message "Restore exact production after failed release $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify restored production version
        # Verify even when Wrangler reported that restoration failed: the API
        # may have accepted the change before the client lost its response.
        if: ${{ always() && steps.restore.outcome != 'skipped' }}
        run: npm run --silent worker:verify-deployment -- '${{ steps.previous.outputs.version_id }}@100'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record coordinated Worker baseline
        id: baseline_marker
        # The first pre-architecture Worker cannot attest release metadata.
        # Record the successful handover once; any later unproven capture then
        # fails closed instead of repeatedly receiving the bootstrap exception.
        if: ${{ success() && steps.previous_attestation.outputs.baseline_marker_required == 'true' }}
        run: npm run worker:mark-baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Garbage-collect superseded forecast generations
        id: kv_gc
        # This is deliberately after the restoration steps. A cleanup failure
        # must never roll traffic back to a Worker whose stale KV generation
        # may already have been deleted.
        if: ${{ success() && steps.previous_attestation.outputs.kv_gc_allowed == 'true' }}
        run: |
          npm run worker:gc-kv -- \
            --apply \
            --attested-active-release '${{ steps.previous_attestation.outputs.release_attestation }}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summarize Worker release
        if: always()
        shell: bash
        run: |
          echo "### Worker release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous version: \`${{ steps.previous.outputs.version_id || 'not captured' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Captured release: \`${{ steps.previous_attestation.outputs.mode || 'not attested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate version: \`${{ steps.candidate.outputs.version_id || 'not resolved' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate gate: exact current target" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compatibility gate: breaking APIs blocked without continuous adapters" >> "$GITHUB_STEP_SUMMARY"
          echo "- Post-promotion gate: read-only ordinary traffic" >> "$GITHUB_STEP_SUMMARY"
          echo "- Superseded KV cleanup: \`${{ steps.kv_gc.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline marker: \`${{ steps.baseline_marker.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Promotion: \`${{ steps.promote.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic restore: \`${{ steps.restore.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"

  pages_release:
    needs: [build, worker_release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Deploy the tested Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Verify exact Pages build and every shell asset
        run: |
          node scripts/verify-pages-release.mjs \
            --base-url '${{ steps.deployment.outputs.page_url }}' \
            --expected-build-id '${{ needs.build.outputs.build_id }}'

      - name: Summarize production release
        if: always()
        shell: bash
        run: |
          echo "### Production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`${{ needs.worker_release.outputs.candidate_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages build: \`${{ needs.build.outputs.build_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
