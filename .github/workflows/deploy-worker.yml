name: Deploy forecast Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frank-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual dispatch is deliberate: ordinary pushes, pull requests, and forks
    # can validate the bundle but can never receive production credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: worker-production
    env:
      # The release gate must always test the production service this workflow
      # deploys; a dispatch-time URL could accidentally green an unrelated host.
      FRANK_WORKER_BASE_URL: https://frank-forecast.alswatchs.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check generated Worker types
        run: npm run worker:types:check

      - name: Type-check Worker and runtime tests
        run: npm run worker:typecheck

      - name: Test Worker runtime
        run: npm run test:worker-runtime

      - name: Validate Worker bundle
        run: npm run worker:dry-run

      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment credentials are not configured for worker-production."
            exit 1
          fi

      - name: Capture active production version
        id: previous
        shell: bash
        run: |
          version_id="$(npm run --silent worker:active-version)"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        id: deploy
        run: npm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Warm forecasts and require health
        run: npm run worker:warm -- --base-url "$FRANK_WORKER_BASE_URL"

      - name: Roll back a release that fails its production gate
        if: failure() && steps.deploy.outcome == 'success'
        run: npm run worker:rollback -- "${{ steps.previous.outputs.version_id }}" --yes --message "Automatic rollback after failed FRANK release gate $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
