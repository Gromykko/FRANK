name: Validate FRANK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pushes and pull requests validate a releasable commit but never mutate
# production. The protected manual production workflow builds its own exact
# artifact from the dispatched SHA after repeating these gates.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release compatibility policy
        run: npm run release:check-contract

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Check generated Worker types
        run: npm run worker:types:check

      - name: Type-check Worker and runtime tests
        run: npm run worker:typecheck

      - name: Test Worker runtime
        run: npm run test:worker-runtime

      - name: Validate Worker bundle
        run: npm run worker:dry-run

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: End-to-end test
        run: npm exec -- playwright test
