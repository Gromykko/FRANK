name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR validation is disposable. A production run is not: canceling
  # it between the Worker and Pages steps can leave a mixed release live.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release compatibility policy
        run: npm run release:check-contract

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Check generated Worker types
        run: npm run worker:types:check

      - name: Type-check Worker and runtime tests
        run: npm run worker:typecheck

      - name: Test Worker runtime
        run: npm run test:worker-runtime

      - name: Validate Worker bundle
        run: npm run worker:dry-run

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: End-to-end test
        run: npm exec -- playwright test

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy_worker:
    name: Deploy Worker
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: worker-production
      url: https://frank-forecast.alswatchs.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Worker
        run: npx wrangler deploy --message "Deploy ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The Worker is already live at this point. Cleanup is maintenance, not a
      # release gate: failing here must not strand the compatible new Worker in
      # front of the old Pages client. The failed step remains visible in the
      # run summary and the next deployment retries it.
      - name: Clean stale KV generations (best effort)
        continue-on-error: true
        run: npm run worker:gc-kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  warm_worker:
    name: Warm Worker
    needs: deploy_worker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Warm all forecast locations
        run: node scripts/warm-worker.mjs
        env:
          FRANK_WARM_TOKEN: ${{ secrets.FRANK_WARM_TOKEN }}
          FRANK_WORKER_BASE_URL: ${{ vars.FRANK_WORKER_BASE_URL }}

  deploy_pages:
    name: Deploy GitHub Pages
    # Publish only after the backward-compatible Worker is live and every
    # location is ready. Either failed gate keeps the old Pages release live.
    needs: [validate, deploy_worker, warm_worker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
