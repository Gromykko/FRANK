name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR validation is disposable. A production run is not: canceling
  # it between the Worker and Pages steps can leave a mixed release live.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release compatibility policy
        run: npm run release:check-contract

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Check generated Worker types
        run: npm run worker:types:check

      - name: Type-check Worker and runtime tests
        run: npm run worker:typecheck

      - name: Test Worker runtime
        run: npm run test:worker-runtime

      - name: Validate Worker bundle
        run: npm run worker:dry-run

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: End-to-end test
        run: npm exec -- playwright test

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  upload_candidate:
    name: Upload Worker candidate
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version_id: ${{ steps.candidate.outputs.version_id }}
      preview_url: ${{ steps.candidate.outputs.preview_url }}
    environment:
      name: worker-production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture current Worker deployment
        run: npx wrangler deployments status --json > "$RUNNER_TEMP/frank-current-deployment.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Preview URLs are a persistent Worker-level setting and must exist
      # BEFORE the candidate is warmed, which is why this runs pre-promotion.
      # Manual dispatch is the explicit bootstrap/recovery path.
      #
      # Ongoing trigger sync is NOT this step's job: the promote job runs
      # `wrangler triggers deploy` after promotion on every deploy, so cron
      # schedules follow wrangler.jsonc without a manual run. This one stays
      # only for first-time/recovery bootstrap. Both are idempotent.
      - name: Enable Worker version preview URLs (manual bootstrap)
        if: github.event_name == 'workflow_dispatch'
        run: npx wrangler triggers deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload zero-traffic Worker candidate
        run: npx wrangler versions upload --message "Candidate ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/frank-version-upload.ndjson

      - name: Validate and expose candidate metadata
        id: candidate
        env:
          CURRENT_DEPLOYMENT_PATH: ${{ runner.temp }}/frank-current-deployment.json
          FRANK_WORKER_BASE_URL: ${{ vars.FRANK_WORKER_BASE_URL }}
          VERSION_UPLOAD_PATH: ${{ runner.temp }}/frank-version-upload.ndjson
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const fail = (message) => {
            throw new Error('[candidate-metadata] ' + message);
          };
          const uuidPattern = /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/;
          const productionHostPattern =
            /^frank-forecast\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.workers\.dev$/;

          let currentDeployment;
          try {
            currentDeployment = JSON.parse(
              readFileSync(process.env.CURRENT_DEPLOYMENT_PATH, 'utf8'),
            );
          } catch {
            fail('current deployment output is missing or invalid JSON');
          }

          const currentVersions = currentDeployment?.versions;
          if (
            currentDeployment?.strategy !== 'percentage'
            || !Array.isArray(currentVersions)
            || currentVersions.length !== 1
            || currentVersions[0]?.percentage !== 100
            || !uuidPattern.test(currentVersions[0]?.version_id ?? '')
          ) {
            fail('expected exactly one valid version at 100% traffic');
          }
          const previousVersionId = currentVersions[0].version_id;

          let uploadRecords;
          try {
            uploadRecords = readFileSync(process.env.VERSION_UPLOAD_PATH, 'utf8')
              .split(/\r?\n/)
              .filter((line) => line.trim() !== '')
              .map((line) => JSON.parse(line));
          } catch {
            fail('Wrangler upload output is missing or invalid NDJSON');
          }

          if (uploadRecords.some((record) => record?.type === 'command-failed')) {
            fail('Wrangler recorded a failed upload command');
          }
          const sessionRecords = uploadRecords.filter(
            (record) => record?.type === 'wrangler-session',
          );
          const candidateRecords = uploadRecords.filter(
            (record) => record?.type === 'version-upload',
          );
          if (
            sessionRecords.length !== 1
            || sessionRecords[0]?.version !== 1
            || candidateRecords.length !== 1
            || candidateRecords[0]?.version !== 1
          ) {
            fail('expected exactly one Wrangler session and one version-upload record');
          }

          const candidateVersionId = candidateRecords[0].version_id;
          const candidatePreviewUrl = candidateRecords[0].preview_url;
          if (
            candidateRecords[0].worker_name !== 'frank-forecast'
            || candidateRecords[0].worker_name_overridden !== false
            || !uuidPattern.test(candidateVersionId ?? '')
            || candidateVersionId === previousVersionId
          ) {
            fail('candidate version ID is missing or invalid');
          }
          if (
            typeof candidatePreviewUrl !== 'string'
            || candidatePreviewUrl.trim() !== candidatePreviewUrl
            || /[\r\n]/.test(candidatePreviewUrl)
          ) {
            fail('candidate preview URL is missing or invalid');
          }

          let parsedPreviewUrl;
          try {
            parsedPreviewUrl = new URL(candidatePreviewUrl);
          } catch {
            fail('candidate preview URL is not a URL');
          }
          if (
            parsedPreviewUrl.protocol !== 'https:'
            || parsedPreviewUrl.username
            || parsedPreviewUrl.password
            || parsedPreviewUrl.search
            || parsedPreviewUrl.hash
          ) {
            fail('candidate preview URL must be credential-free HTTPS without query or fragment');
          }

          const configuredWorkerBaseUrl = process.env.FRANK_WORKER_BASE_URL;
          if (
            typeof configuredWorkerBaseUrl !== 'string'
            || configuredWorkerBaseUrl.trim() === ''
            || configuredWorkerBaseUrl.trim() !== configuredWorkerBaseUrl
            || /[\r\n]/.test(configuredWorkerBaseUrl)
          ) {
            fail('FRANK_WORKER_BASE_URL is missing or invalid');
          }

          let productionUrl;
          try {
            productionUrl = new URL(configuredWorkerBaseUrl);
          } catch {
            fail('FRANK_WORKER_BASE_URL is not a valid URL');
          }
          if (productionUrl.protocol !== 'https:') {
            fail('FRANK_WORKER_BASE_URL must use https');
          }
          if (
            productionUrl.username
            || productionUrl.password
            || productionUrl.port
            || productionUrl.pathname !== '/'
            || productionUrl.search
            || productionUrl.hash
            || !productionHostPattern.test(productionUrl.hostname)
          ) {
            fail('FRANK_WORKER_BASE_URL must be the root production workers.dev URL');
          }

          const expectedPreviewOrigin =
            'https://' + candidateVersionId.slice(0, 8) + '-' + productionUrl.hostname;
          if (
            parsedPreviewUrl.origin !== expectedPreviewOrigin
            || parsedPreviewUrl.pathname !== '/'
          ) {
            fail('candidate preview URL does not match the uploaded Worker version');
          }

          appendFileSync(process.env.GITHUB_OUTPUT, [
            'version_id=' + candidateVersionId,
            'preview_url=' + candidatePreviewUrl,
            '',
          ].join('\n'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '### Worker candidate',
            '',
            'Candidate version ID: ' + candidateVersionId,
            '',
            'Previous live version ID: ' + previousVersionId,
            '',
            'Manual rollback after promotion:',
            '',
            '    wrangler versions deploy ' + previousVersionId + '@100%',
            '',
          ].join('\n'));
          NODE

  warm_candidate:
    name: Warm Worker candidate
    needs: upload_candidate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Warm all forecast locations
        run: node scripts/warm-worker.mjs
        env:
          FRANK_WARM_TOKEN: ${{ secrets.FRANK_WARM_TOKEN }}
          FRANK_WORKER_BASE_URL: ${{ needs.upload_candidate.outputs.preview_url }}

  promote_worker:
    name: Promote Worker candidate
    needs: [upload_candidate, warm_candidate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: worker-production
      url: ${{ vars.FRANK_WORKER_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promote candidate to 100% traffic
        run: npx wrangler versions deploy "${CANDIDATE_VERSION_ID}@100%" --yes --message "Promote ${{ github.sha }}"
        env:
          CANDIDATE_VERSION_ID: ${{ needs.upload_candidate.outputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cron schedules, routes and custom domains are Worker-LEVEL settings and
      # are not carried by `versions deploy`, which only moves code. Without
      # this step wrangler.jsonc can disagree with the live schedule
      # indefinitely, and nothing catches it: production ran `*/5 * * * *` for
      # an unknown period while the repo said `* * * * *` (found 2026-08-24),
      # so, with the then-four-location manifest, every city refreshed every 20
      # minutes instead of every 4. The
      # CRON_PERIOD_MS guard test cannot detect this because it compares the
      # repo against itself, never against what is deployed.
      #
      # Runs AFTER promotion on purpose: a schedule applies to whatever version
      # is live, so syncing earlier would drive the OLD code at the NEW cadence
      # for the length of the deploy.
      #
      # This is a release gate, not maintenance: a sync failure must fail the
      # run rather than be tolerated, because silent trigger drift is the exact
      # failure being fixed here.
      - name: Sync Worker triggers to wrangler.jsonc
        run: npx wrangler triggers deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # `versions deploy` printing SUCCESS is not proof the deployment stuck.
      # On 2026-08-26 run 33006408963 promoted c9f1a0ee at 100%, wrangler
      # reported success, and production kept serving the previous version
      # b3741d13 - every job green, the release silently not live. The trigger
      # sync above re-reads the deployment about two seconds after the promote
      # and is the likeliest re-pinner. Rather than guess, ask production what
      # it is running: the Worker stamps its own version on every response, so
      # this is the one check that compares the deploy against reality instead
      # of against the repo.
      - name: Verify production took the promoted version
        env:
          CANDIDATE_VERSION_ID: ${{ needs.upload_candidate.outputs.version_id }}
          FRANK_WORKER_BASE_URL: ${{ vars.FRANK_WORKER_BASE_URL }}
        run: |
          for attempt in $(seq 1 10); do
            live=$(curl -fsS -o /dev/null -D - "$FRANK_WORKER_BASE_URL/health" \
              | awk -F': ' 'tolower($1) == "x-frank-worker-version" { gsub(/[[:space:]]/, "", $2); print $2 }')
            if [ "$live" = "$CANDIDATE_VERSION_ID" ]; then
              echo "production is serving $live"
              exit 0
            fi
            echo "attempt $attempt: production serving ${live:-unknown}"
            sleep 6
          done
          echo "::error::production never took $CANDIDATE_VERSION_ID (still $live)"
          exit 1

      # Promotion has succeeded before cleanup starts. Cleanup is maintenance,
      # not a release gate: a failure remains visible and the next deployment
      # retries it without blocking the compatible Pages release.
      - name: Clean stale KV generations (best effort)
        continue-on-error: true
        run: npm run worker:gc-kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy_pages:
    name: Deploy GitHub Pages
    # Publish only after all candidate locations are ready and that exact Worker
    # version has been promoted. Any failed gate keeps the old Pages release live.
    needs: [validate, upload_candidate, warm_candidate, promote_worker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
