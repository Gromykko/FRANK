version: 2

# Keep the supply chain current without flooding a student-maintained project
# with one pull request per patch. Major upgrades stay isolated for review;
# compatible minor/patch updates are grouped and must pass the full CI suite.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
